services:
  igen-erp:
    image: ghcr.io/chung2310/igen-erp:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-igen-erp}
    restart: always
    mem_limit: 1536m
    mem_reservation: 512m
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      QUOTATION_WORKERS_ENABLED: "true"
      QUOTATION_QUEUE_PREFIX: "${QUOTATION_QUEUE_PREFIX:-${CONTAINER_NAME:-igen-erp}-quotation}"
      GYM_BACKEND_URL: "http://gym-api:3018"
    volumes:
      - .env:/app/.env
      - ./logs:/app/logs
      - ai_settlement_journal:/app/server/cache/ai-settlements
      - gym_uploads:/app/uploads/gym
    networks:
      - default_network
    dns:
      - 8.8.8.8
      - 1.1.1.1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  marketing-worker:
    image: ghcr.io/chung2310/igen-erp:${IMAGE_TAG:-latest}
    profiles: ["marketing"]
    restart: unless-stopped
    command: ["node", "dist-server/marketing-worker.cjs"]
    env_file: [.env]
    volumes:
      - ai_settlement_journal:/app/server/cache/ai-settlements
    environment:
      MARKETING_WORKERS_ENABLED: "true"
      MARKETING_WORKER_ROLE: ${MARKETING_WORKER_ROLE:-all}
    networks: [default_network]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  gym-api:
    image: ghcr.io/chung2310/igen-erp:${IMAGE_TAG:-latest}
    profiles: ["gym"]
    restart: unless-stopped
    command: ["node", "gym-module/3s/dist/backend/bootstrap.js"]
    env_file: [.env]
    environment:
      NODE_ENV: production
      GYM_EMBEDDED: "1"
      PORT: "3018"
      MONGODB_URI: "${GYM_MONGODB_URI:-}"
      MONGODB_USER: "${GYM_MONGODB_USER:-}"
      MONGODB_PASSWORD: "${GYM_MONGODB_PASSWORD:-}"
      MONGODB_AUTH_SOURCE: "${GYM_MONGODB_AUTH_SOURCE:-}"
      JWT_SECRET: "${GYM_BRIDGE_SECRET:-}"
      APP_URL: "${GYM_APP_URL:-}"
      OPENROUTER_API_KEY: "${GYM_OPENROUTER_API_KEY:-${OPENROUTER_API_KEY:-}}"
      OPENROUTER_REASONING_EFFORT: "${GYM_OPENROUTER_REASONING_EFFORT:-}"
      AI_MODEL: "${GYM_AI_MODEL:-}"
      OCR_MODEL: "${GYM_OCR_MODEL:-}"
      AI_COMPANY_PAID_DAILY_CALLS_PER_USER: "${GYM_AI_COMPANY_PAID_DAILY_CALLS_PER_USER:-}"
      AI_COMPANY_PAID_MONTHLY_CALLS_PER_USER: "${GYM_AI_COMPANY_PAID_MONTHLY_CALLS_PER_USER:-}"
      AI_COMPANY_PAID_MONTHLY_CALLS_PER_CENTER: "${GYM_AI_COMPANY_PAID_MONTHLY_CALLS_PER_CENTER:-}"
      AI_GLOBAL_MONTHLY_BUDGET_VND: "${GYM_AI_GLOBAL_MONTHLY_BUDGET_VND:-}"
      AI_GLOBAL_MAX_RESERVATION_VND: "${GYM_AI_GLOBAL_MAX_RESERVATION_VND:-}"
      CLOUDINARY_CLOUD_NAME: "${GYM_CLOUDINARY_CLOUD_NAME:-${CLOUDINARY_CLOUD_NAME:-}}"
      CLOUDINARY_API_KEY: "${GYM_CLOUDINARY_API_KEY:-${CLOUDINARY_API_KEY:-}}"
      CLOUDINARY_API_SECRET: "${GYM_CLOUDINARY_API_SECRET:-${CLOUDINARY_API_SECRET:-}}"
      SEPAY_BANK_CODE: "${GYM_SEPAY_BANK_CODE:-}"
      SEPAY_BANK_NAME: "${GYM_SEPAY_BANK_NAME:-}"
      SEPAY_ACCOUNT_NUMBER: "${GYM_SEPAY_ACCOUNT_NUMBER:-}"
      SEPAY_ACCOUNT_HOLDER: "${GYM_SEPAY_ACCOUNT_HOLDER:-}"
      SEPAY_WEBHOOK_API_KEY: "${GYM_SEPAY_WEBHOOK_API_KEY:-}"
      SEPAY_QR_ACCOUNT_NUMBER: "${GYM_SEPAY_QR_ACCOUNT_NUMBER:-}"
      SEPAY_SUB_ACCOUNT: "${GYM_SEPAY_SUB_ACCOUNT:-}"
      SEPAY_TRANSFER_NOTE: "${GYM_SEPAY_TRANSFER_NOTE:-}"
      SEPAY_TRANSFER_PREFIX: "${GYM_SEPAY_TRANSFER_PREFIX:-}"
      PAYOS_CLIENT_ID: "${GYM_PAYOS_CLIENT_ID:-}"
      PAYOS_API_KEY: "${GYM_PAYOS_API_KEY:-}"
      PAYOS_CHECKSUM_KEY: "${GYM_PAYOS_CHECKSUM_KEY:-}"
      PAYOS_RETURN_URL: "${GYM_PAYOS_RETURN_URL:-}"
      PAYOS_CANCEL_URL: "${GYM_PAYOS_CANCEL_URL:-}"
      VNPAY_TMN_CODE: "${GYM_VNPAY_TMN_CODE:-}"
      VNPAY_HASH_SECRET: "${GYM_VNPAY_HASH_SECRET:-}"
      VNPAY_PAYMENT_URL: "${GYM_VNPAY_PAYMENT_URL:-}"
      VNPAY_RETURN_URL: "${GYM_VNPAY_RETURN_URL:-}"
      VNPAY_IPN_URL: "${GYM_VNPAY_IPN_URL:-}"
      MOMO_PARTNER_CODE: "${GYM_MOMO_PARTNER_CODE:-}"
      MOMO_ACCESS_KEY: "${GYM_MOMO_ACCESS_KEY:-}"
      MOMO_SECRET_KEY: "${GYM_MOMO_SECRET_KEY:-}"
      MOMO_API_URL: "${GYM_MOMO_API_URL:-}"
      MOMO_REDIRECT_URL: "${GYM_MOMO_REDIRECT_URL:-}"
      MOMO_IPN_URL: "${GYM_MOMO_IPN_URL:-}"
    networks: [default_network]
    volumes:
      - gym_uploads:/app/uploads


volumes:
  ai_settlement_journal:
  gym_uploads:

networks:
  default_network:
    external: true
