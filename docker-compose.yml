version: '3.8'

services:
  igen-erp:
    image: ghcr.io/chung2310/igen-erp:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-igen-erp}
    restart: always
    mem_limit: 1536m
    mem_reservation: 512m
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - .env:/app/.env
      - ./logs:/app/logs
      - ai_settlement_journal:/app/server/cache/ai-settlements
    networks:
      - default_network
    dns:
      - 8.8.8.8
      - 1.1.1.1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  marketing-worker:
    image: ghcr.io/chung2310/igen-erp:${IMAGE_TAG:-latest}
    profiles: ["marketing"]
    restart: unless-stopped
    command: ["node", "dist-server/marketing-worker.cjs"]
    env_file: [.env]
    volumes:
      - ai_settlement_journal:/app/server/cache/ai-settlements
    environment:
      MARKETING_WORKERS_ENABLED: "true"
      MARKETING_WORKER_ROLE: ${MARKETING_WORKER_ROLE:-all}
    networks: [default_network]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ai_settlement_journal:

networks:
  default_network:
    external: true
